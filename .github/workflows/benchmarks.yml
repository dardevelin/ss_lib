name: Benchmarks

on:
  schedule:
    # Every Sunday at 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ 'src/**', 'include/**', 'benchmarks/**' ]
  pull_request:
    branches: [ main ]
    paths: [ 'src/**', 'include/**', 'benchmarks/**' ]

permissions:
  contents: read

jobs:
  benchmark:
    name: Performance Benchmarks (${{ matrix.os }})
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            cc: gcc
          - os: macos-latest
            cc: clang
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and run benchmark
        run: make CC=${{ matrix.cc }} benchmark | tee benchmark_results.txt

      - name: Upload benchmark results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-results-${{ matrix.os }}
          path: benchmark_results.txt

      - name: Run comprehensive benchmarks
        if: matrix.os == 'ubuntu-latest'
        run: benchmarks/run_benchmarks.sh

      - name: Upload comprehensive results
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: comprehensive-benchmark-results
          path: build/benchmarks/

  benchmark-comparison:
    name: Benchmark Comparison
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    env:
      BASE_REF: ${{ github.base_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Benchmark the pull request
        run: make benchmark > pr_results.txt

      - name: Benchmark the base branch
        run: |
          git worktree add ../base "origin/$BASE_REF"
          make -C ../base benchmark > base_results.txt

      - name: Compare
        run: python3 benchmarks/compare.py base_results.txt pr_results.txt > comparison.md

      - name: Comment on the pull request
        # Tokens for pull requests from forks cannot write comments
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## Benchmark Comparison\n\n' + fs.readFileSync('comparison.md', 'utf8'),
            });
