name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  TAG: ${{ github.ref_name }}

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Check version and generated files
      run: |
        scripts/check_version.sh "$TAG"
        make check-single-header

    - name: Create Release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        if gh release view "$TAG" > /dev/null 2>&1; then
          echo "Release $TAG already exists, skipping creation"
        else
          gh release create "$TAG" --generate-notes --verify-tag
        fi

  # The archives hold sources only, so one runner builds both formats
  build-artifacts:
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Package release
      run: |
        mkdir -p "ss_lib-$TAG"
        cp -r include/ src/ examples/ docs/ "ss_lib-$TAG/"
        cp include/ss_lib_single.h README.md LICENSE CHANGELOG.md "ss_lib-$TAG/"
        tar -czf "ss_lib-$TAG.tar.gz" "ss_lib-$TAG"
        zip -qr "ss_lib-$TAG.zip" "ss_lib-$TAG"

    - name: Upload Release Assets
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release upload "$TAG" "ss_lib-$TAG.tar.gz" "ss_lib-$TAG.zip" --clobber
