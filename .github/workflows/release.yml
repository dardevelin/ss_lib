name: Release

# Pushing a tag vMAJOR.MINOR.PATCH publishes a release; vX.Y.Z-rc.N (any
# tag with a '-') publishes a pre-release. A release must be tagged on main,
# or on release/MAJOR.x for a maintenance release of an older major version,
# which is published without becoming the latest release. CONTRIBUTING.md
# has the steps.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}

env:
  TAG: ${{ github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Check tag, version and release notes
      run: |
        scripts/check_version.sh "$TAG"
        scripts/release_notes.sh "$TAG" > release-notes.md
        major=${TAG#v}
        major=${major%%.*}
        case "$TAG" in
          *-*) ;;  # pre-releases may come from a release or version branch
          *) if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
               :
             elif git merge-base --is-ancestor "$GITHUB_SHA" "origin/release/$major.x" 2>/dev/null; then
               echo "MAINTENANCE=1" >> "$GITHUB_ENV"   # not the latest release
             else
               echo "$TAG is not on main or on release/$major.x" >&2; exit 1
             fi ;;
        esac

    - name: Test every configuration
      run: make -j4 all && make test-all

    - name: Package
      # The archives are the tagged tree (minus export-ignore paths in
      # .gitattributes), so they build with make or CMake as shipped
      run: |
        mkdir dist
        git archive --format=tar.gz --prefix="ss_lib-$TAG/" -o "dist/ss_lib-$TAG.tar.gz" "$TAG"
        git archive --format=zip --prefix="ss_lib-$TAG/" -o "dist/ss_lib-$TAG.zip" "$TAG"
        cp include/ss_lib_single.h dist/
        (cd dist && sha256sum -- * > SHA256SUMS)
        cat dist/SHA256SUMS

    - name: Publish
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        if gh release view "$TAG" > /dev/null 2>&1; then
          echo "Release $TAG exists; replacing its assets"
          gh release upload "$TAG" dist/* --clobber
        else
          kind=""
          case "$TAG" in *-*) kind="--prerelease" ;; esac
          [ -n "${MAINTENANCE:-}" ] && kind="--latest=false"
          # shellcheck disable=SC2086
          gh release create "$TAG" dist/* --verify-tag $kind \
            --title "SS_Lib ${TAG#v}" --notes-file release-notes.md
        fi
